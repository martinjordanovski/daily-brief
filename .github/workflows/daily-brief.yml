name: Daily brief

on:
  schedule:
    - cron: "13 5 * * *"   # 05:13 UTC = 06:13 Skopje in winter, 07:13 in summer
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only test the news sources (no AI call, nothing saved)"
        type: boolean
        default: false
      weekly:
        description: "Include the weekly sections (Leadership, Psychology, Investment) even if it's not Monday"
        type: boolean
        default: false

# Only what the job needs: push the brief, and ask GitHub for a short-lived identity token
# that Anthropic swaps for a ~10-minute access token (no API key stored anywhere).
permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Skopje
    steps:
      # No third-party actions at all: nothing outside this repo runs in the job.
      - name: Check out
        run: git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo

      - name: Tripwire
        working-directory: repo
        run: python3 scripts/tripwire.py

      - name: Fetch sources
        working-directory: repo
        env:
          FORCE_WEEKLY: ${{ inputs.weekly && '1' || '' }}
        run: python3 scripts/fetch.py

      # Keyless: these IDs are not secrets. The federation rule in the Claude Console only accepts
      # tokens from this repo's main branch, and the workspace has a $10 monthly limit.
      - name: Summarize
        if: ${{ !inputs.check_only }}
        working-directory: repo
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: python3 scripts/summarize.py

      - name: Commit
        if: ${{ !inputs.check_only }}
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs data feed.xml
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "brief $(date +%F)"
          git push

      - name: Alert on code changes
        working-directory: repo
        run: |
          if [ -s "$RUNNER_TEMP/tripwire.txt" ]; then
            cat "$RUNNER_TEMP/tripwire.txt"
            echo "::error::Watched files changed since the last run. If these commits are not yours, revoke the API key now."
            exit 1
          fi
